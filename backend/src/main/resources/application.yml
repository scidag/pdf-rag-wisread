spring:
  profiles:
    active: prod
  application:
    name: wisread-backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/wisread}
    username: ${POSTGRES_USER:wisread}
    password: ${POSTGRES_PASSWORD:wisread123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  flyway:
    enabled: true
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: ${DASHSCOPE_BASE_URL:https://llm-kel2sus4xmrwoah1.cn-beijing.maas.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: qwen3.7-plus
          temperature: 0.7
      embedding:
        options:
          model: qwen3.7-text-embedding

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      update-strategy: ALWAYS

server:
  port: 8080
  tomcat:
    # 默认 2MB：超限请求会被直接断连（浏览器表现为 Failed to fetch / ERR_CONNECTION_RESET），
    # 调大后服务端能吞掉剩余请求体并正常返回 413 JSON。
    max-swallow-size: 120MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

wisread:
  jwt:
    secret: ${JWT_SECRET:wisread-dev-secret-change-me-please-32bytes}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cors:
    allowed-origins: ${WISREAD_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  embedding:
    mock-enabled: false
  chat:
    mock-enabled: false
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
    access-key: ${MINIO_ROOT_USER:wisread}
    secret-key: ${MINIO_ROOT_PASSWORD:wisread123}
    bucket: ${MINIO_BUCKET:wisread-documents}
