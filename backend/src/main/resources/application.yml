spring:
  application:
    name: wisread-backend
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/wisread}
    username: ${POSTGRES_USER:wisread}
    password: ${POSTGRES_PASSWORD:wisread123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:dummy-local-key}
      chat:
        options:
          model: ${WISREAD_CHAT_MODEL:qwen-plus}
      embedding:
        options:
          model: ${WISREAD_EMBEDDING_MODEL:text-embedding-v3}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

wisread:
  jwt:
    secret: ${JWT_SECRET:wisread-dev-secret-change-me-please-32bytes}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  embedding:
    mock-enabled: ${WISREAD_EMBEDDING_MOCK_ENABLED:true}
  chat:
    mock-enabled: ${WISREAD_CHAT_MOCK_ENABLED:true}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
    access-key: ${MINIO_ROOT_USER:wisread}
    secret-key: ${MINIO_ROOT_PASSWORD:wisread123}
    bucket: ${MINIO_BUCKET:wisread-documents}
