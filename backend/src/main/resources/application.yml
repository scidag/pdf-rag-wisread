spring:
  profiles:
    active: prod
  application:
    name: wisread-backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/wisread}
    username: ${POSTGRES_USER:wisread}
    password: ${POSTGRES_PASSWORD:wisread123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  flyway:
    enabled: true
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: ${DASHSCOPE_BASE_URL:https://llm-kel2sus4xmrwoah1.cn-beijing.maas.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: qwen3.7-plus
          temperature: 0.7
      embedding:
        options:
          model: qwen3.7-text-embedding

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      update-strategy: ALWAYS

server:
  port: 8080
  tomcat:
    # 默认 2MB：超限请求会被直接断连（浏览器表现为 Failed to fetch / ERR_CONNECTION_RESET），
    # 调大后服务端能吞掉剩余请求体并正常返回 413 JSON。
    max-swallow-size: 120MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

wisread:
  jwt:
    # 双密钥：current 签发+校验；previous 仅校验（密钥无感轮换，FR-4）
    secret-current: ${JWT_SECRET_CURRENT:wisread-dev-secret-change-me-please-32bytes}
    secret-previous: ${JWT_SECRET_PREVIOUS:}
    access-token-ttl: 15m
    # FR-5：refresh 会话绝对有效期（自登录起 24 小时，轮换不延长）
    refresh-token-ttl: 24h
  auth:
    # FR-6：哑哈希（未配置时启动随机生成，时延特征一致）
    # dummy-password-hash: <BCrypt 串>
    refresh-grace-window: 5m
    refresh-grace-strict-ip: false
    # R1→R2 过渡：接受无 typ 声明的旧 refresh token（access 侧始终强制校验）
    legacy-typ-accepted: true
  session:
    # AES-256-GCM 密钥（Base64 的 32 字节），FR-8 宽限重发用
    cipher-key: ${SESSION_CIPHER_KEY:d2VpcndlaS1kZXYtY2lwaGVyLWtleS0zMmJ5dGVzIQ==}
  session-store:
    # postgres | redis-migrate | redis（FR-7 分阶段迁移）
    mode: ${WISREAD_SESSION_STORE_MODE:postgres}
  trust-proxy: ${WISREAD_TRUST_PROXY:false}
  ratelimit:
    auth-per-minute: 10
    refresh-per-minute: 30
  cors:
    allowed-origins: ${WISREAD_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
    access-key: ${MINIO_ROOT_USER:wisread}
    secret-key: ${MINIO_ROOT_PASSWORD:wisread123}
    bucket: ${MINIO_BUCKET:wisread-documents}