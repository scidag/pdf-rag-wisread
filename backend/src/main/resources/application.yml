spring:
  application:
    name: wisread-backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/wisread}
    username: ${POSTGRES_USER:wisread}
    password: ${POSTGRES_PASSWORD:wisread123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  flyway:
    enabled: true
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:dummy-local-key}
      chat:
        options:
          model: ${WISREAD_CHAT_MODEL:qwen-plus}
      embedding:
        options:
          model: ${WISREAD_EMBEDDING_MODEL:text-embedding-v3}

server:
  port: 8080
  tomcat:
    # 默认 2MB：超限请求会被直接断连（浏览器表现为 Failed to fetch / ERR_CONNECTION_RESET），
    # 调大后服务端能吞掉剩余请求体并正常返回 413 JSON。
    max-swallow-size: 120MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

wisread:
  jwt:
    secret: ${JWT_SECRET:wisread-dev-secret-change-me-please-32bytes}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cors:
    allowed-origins: ${WISREAD_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  embedding:
    mock-enabled: ${WISREAD_EMBEDDING_MOCK_ENABLED:true}
  chat:
    mock-enabled: ${WISREAD_CHAT_MOCK_ENABLED:true}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
    access-key: ${MINIO_ROOT_USER:wisread}
    secret-key: ${MINIO_ROOT_PASSWORD:wisread123}
    bucket: ${MINIO_BUCKET:wisread-documents}
